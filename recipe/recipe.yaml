context:
  version: "1.4.7"

package:
  name: btop
  version: ${{ version }}

source:
  url: https://github.com/aristocratos/btop/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 933de2e4d1b2211a638be463eb6e8616891bfba73aef5d38060bd8319baeefc6

build:
  number: 0
  skip: [win]
  script:
    - if: osx
      then:
        - export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY -DkIOMainPortDefault=kIOMasterPortDefault"
    - make -j$CPU_COUNT CXX=$CXX STRIP=true
    - make -j$CPU_COUNT PREFIX=$PREFIX install

requirements:
  build:
    - make
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}

tests:
  - script:
      - btop --version

about:
  homepage: https://github.com/aristocratos/btop
  repository: https://github.com/aristocratos/btop
  license: Apache-2.0
  license_file:
    - LICENSE
  summary: Resource monitor that shows usage and stats for processor, memory, disks, network and processes.

extra:
  recipe-maintainers:
    - wolfv
